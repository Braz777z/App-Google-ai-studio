workflows:
  android-debug-apk:
    name: Build Debug APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      java: 21
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Prepare Android SDK 36 & debug keystore
        script: |
          set -e
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/share/android-sdk}}"
          SDK_BIN=""
          for candidate in \
            "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK_ROOT/tools/bin/sdkmanager" \
            "$(command -v sdkmanager 2>/dev/null || true)"; do
            if [ -n "$candidate" ] && [ -x "$candidate" ]; then
              SDK_BIN="$candidate"
              break
            fi
          done

          if [ -z "$SDK_BIN" ]; then
            echo "ERREUR : sdkmanager introuvable sous $SDK_ROOT"
            exit 1
          fi

          yes | "$SDK_BIN" --licenses >/dev/null 2>&1 || true
          "$SDK_BIN" "cmdline-tools;latest" >/dev/null 2>&1 || true
          LATEST_SDK_BIN="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$LATEST_SDK_BIN" ]; then
            SDK_BIN="$LATEST_SDK_BIN"
            yes | "$SDK_BIN" --licenses >/dev/null 2>&1 || true
          fi

          "$SDK_BIN" "platform-tools" "build-tools;36.0.0" "platforms;android-36" "platforms;android-36.1" || \
            "$SDK_BIN" "platform-tools" "build-tools;36.0.0" "platforms;android-36"

          echo "sdk.dir=$SDK_ROOT" > local.properties
          [ -f ".env" ] || touch .env

          if [ -f "debug.keystore.base64" ] && [ ! -f "debug.keystore" ]; then
            python3 -c "import base64, sys; sys.stdout.buffer.write(base64.b64decode(sys.stdin.read()))" < debug.keystore.base64 > debug.keystore
          fi

      - name: Run unit tests & build Debug APK
        script: |
          set -e
          if [ -x "./gradlew" ]; then
            GRADLE_CMD="./gradlew"
          elif command -v gradle >/dev/null 2>&1 && gradle --version | grep -q "Gradle 9\."; then
            GRADLE_CMD="gradle"
          else
            curl -fSL -o /tmp/gradle.zip "https://services.gradle.org/distributions/gradle-9.3.1-bin.zip"
            unzip -q -o /tmp/gradle.zip -d /tmp/gradle-dist
            GRADLE_CMD="/tmp/gradle-dist/gradle-9.3.1/bin/gradle"
          fi
          "$GRADLE_CMD" --no-daemon :app:testDebugUnitTest --tests com.example.ExampleUnitTest
          "$GRADLE_CMD" --no-daemon :app:assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/*.apk

  android-release-apk:
    name: Build Signed Release APK & AAB
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      java: 21
      # Dans Codemagic > Environment variables, créez le groupe "signing" avec :
      #   KEYSTORE_BASE64, STORE_PASSWORD, KEY_PASSWORD
      # (app/build.gradle.kts utilise keyAlias = "upload")
      groups:
        - signing
    scripts:
      - name: Prepare Android SDK 36 & keystores
        script: |
          set -e
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/share/android-sdk}}"
          SDK_BIN=""
          for candidate in \
            "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK_ROOT/tools/bin/sdkmanager" \
            "$(command -v sdkmanager 2>/dev/null || true)"; do
            if [ -n "$candidate" ] && [ -x "$candidate" ]; then
              SDK_BIN="$candidate"
              break
            fi
          done

          if [ -z "$SDK_BIN" ]; then
            echo "ERREUR : sdkmanager introuvable sous $SDK_ROOT"
            exit 1
          fi

          yes | "$SDK_BIN" --licenses >/dev/null 2>&1 || true
          "$SDK_BIN" "cmdline-tools;latest" >/dev/null 2>&1 || true
          LATEST_SDK_BIN="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$LATEST_SDK_BIN" ]; then
            SDK_BIN="$LATEST_SDK_BIN"
            yes | "$SDK_BIN" --licenses >/dev/null 2>&1 || true
          fi

          "$SDK_BIN" "platform-tools" "build-tools;36.0.0" "platforms;android-36" "platforms;android-36.1" || \
            "$SDK_BIN" "platform-tools" "build-tools;36.0.0" "platforms;android-36"

          echo "sdk.dir=$SDK_ROOT" > local.properties
          [ -f ".env" ] || touch .env

          if [ -f "debug.keystore.base64" ] && [ ! -f "debug.keystore" ]; then
            python3 -c "import base64, sys; sys.stdout.buffer.write(base64.b64decode(sys.stdin.read()))" < debug.keystore.base64 > debug.keystore
          fi

          if [ -n "${CM_KEYSTORE_PATH:-}" ]; then
            echo "KEYSTORE_PATH=$CM_KEYSTORE_PATH" >> "$CM_ENV"
            echo "STORE_PASSWORD=$CM_KEYSTORE_PASSWORD" >> "$CM_ENV"
            echo "KEY_PASSWORD=$CM_KEY_PASSWORD" >> "$CM_ENV"
          elif [ -n "${KEYSTORE_BASE64:-}" ]; then
            python3 -c "import base64, os, sys; sys.stdout.buffer.write(base64.b64decode(os.environ['KEYSTORE_BASE64']))" > "$CM_BUILD_DIR/my-upload-key.jks"
            echo "KEYSTORE_PATH=$CM_BUILD_DIR/my-upload-key.jks" >> "$CM_ENV"
          elif [ ! -f "my-upload-key.jks" ]; then
            echo "ERREUR : Aucun keystore Release trouvé."
            echo "Ajoutez KEYSTORE_BASE64, STORE_PASSWORD et KEY_PASSWORD dans le groupe 'signing' sur Codemagic."
            exit 1
          fi

      - name: Run unit tests & build signed Release APK + AAB
        script: |
          set -e
          if [ -x "./gradlew" ]; then
            GRADLE_CMD="./gradlew"
          elif command -v gradle >/dev/null 2>&1 && gradle --version | grep -q "Gradle 9\."; then
            GRADLE_CMD="gradle"
          else
            curl -fSL -o /tmp/gradle.zip "https://services.gradle.org/distributions/gradle-9.3.1-bin.zip"
            unzip -q -o /tmp/gradle.zip -d /tmp/gradle-dist
            GRADLE_CMD="/tmp/gradle-dist/gradle-9.3.1/bin/gradle"
          fi
          "$GRADLE_CMD" --no-daemon :app:testDebugUnitTest --tests com.example.ExampleUnitTest
          "$GRADLE_CMD" --no-daemon :app:assembleRelease :app:bundleRelease
    artifacts:
      - app/build/outputs/apk/release/*.apk
      - app/build/outputs/bundle/release/*.aab
      - app/build/outputs/**/mapping.txt
